<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <title>Time Sum Calculator</title>
    <link rel="icon" type="image/x-icon" href="favicon.ico">
    <link rel="apple-touch-icon" href="logo/logo.png">
    <link rel="icon" type="image/png" href="logo/logo.png">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Time Calculator">
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header>
        <div class="lang-switch">
          <button id="langPt" class="lang-btn" data-lang="pt">PT</button>
          <button id="langEn" class="lang-btn" data-lang="en">EN</button>
        </div>
        <h1 data-i18n="app.title">Time Sum Calculator</h1>
      </header>
      
      <main>
        <div class="entries-container" id="entriesContainer">
          <!-- Entries will be added here -->
        </div>
        
        <div class="controls">
          <button id="addRowBtn" class="btn btn-primary" data-i18n="controls.addRun">+ Add Run</button>
          <button id="addActivityBtn" class="btn btn-activity" data-i18n="controls.addActivity">+ Add Activity</button>
          <button id="clearAllBtn" class="btn btn-secondary" data-i18n="controls.clearAll">Clear All</button>
        </div>
        
        <div class="summary">
          <h2 data-i18n="summary.heading">Summary</h2>
          <div class="summary-item">
            <span class="label" data-i18n="summary.totalDistance">Total Distance:</span>
            <span id="totalDistance">0</span> km
          </div>
          <div class="summary-item">
            <span class="label" data-i18n="summary.totalTime">Total Time:</span>
            <span id="totalTime">0:00:00</span>
          </div>
          <div class="summary-item">
            <span class="label" data-i18n="summary.averagePace">Average Pace:</span>
            <span id="averagePace">0:00</span>/km
          </div>
        </div>

        <div class="copy-summary">
          <h2 data-i18n="copy.heading">Copy Summary</h2>
          <textarea id="summaryText" class="summary-text" readonly rows="6"></textarea>
          <button id="copySummaryBtn" class="btn btn-primary" data-i18n="copy.button">Copy to Clipboard</button>
        </div>
      </main>
    </div>
    
    <script src="i18n.js"></script>
    <script src="script.js"></script>
  </body>
</html>
